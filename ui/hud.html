<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kvmddc 状态指示</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="picker-body">
  <div class="mac-popover hud-bar" role="status" aria-live="polite">
    <span class="hud-icon-slot muted-icon" id="hudIcon" aria-hidden="true"></span>
    <span class="mac-row-label hud-text" id="hudLabel" hidden>显示器音量</span>
    <div class="chiclet-slider tray-chiclet" id="hudSlider" aria-hidden="true"></div>
    <span class="slider-readout tabular-nums" id="hudReadout">75%</span>
  </div>
  <script src="./hud.js"></script>
</body>
</html>
