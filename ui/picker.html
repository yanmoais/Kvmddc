<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>选择目标主机</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="picker-body">
  <div class="picker-stage" id="picker-stage">
    <div class="picker-card mac-popover" id="picker-card" role="listbox" aria-label="切换目标电脑">
      <div class="picker-header">
        <span>滚轮或悬停 · 松开或点击切入</span>
        <kbd class="tray-kbd picker-esc-btn" id="picker-esc" title="点击取消切换">Esc</kbd>
      </div>
      <div class="picker-list" id="picker-list"></div>
    </div>
  </div>
  <script src="./picker.js"></script>
</body>
</html>
